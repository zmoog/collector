name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ko:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Log in to GHCR
        run: |
          go tool ko login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/collector
        run: |
          cd collector && go tool ko build . \
            --platform=linux/amd64,linux/arm64 \
            --bare \
            --sbom=none \
            --tags "sha-$(git rev-parse --short HEAD),latest"
